name: ci

on:
  push:
  pull_request:

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  knip:
    name: knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm knip

  circular:
    name: circular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm circular

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm manifest:check

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install FFmpeg and Poppler
        run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: pnpm test

  test-redis:
    name: test-redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install FFmpeg and Poppler
        run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: pnpm build
      - run: pnpm --filter filevora exec node --experimental-strip-types --test --test-reporter=spec test/bullmq.test.ts test/m3.test.ts test/m5.test.ts

  test-s3:
    name: test-s3
    runs-on: ubuntu-latest
    services:
      minio:
        # The old Docker Hub MinIO repository is gone. pgsty/silo is a public
        # MinIO-compatible server with the same command, env, and health URL.
        image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
        env:
          MINIO_ROOT_USER: local
          MINIO_ROOT_PASSWORD: localpassword
        ports:
          - 9000:9000
        command: server /data
    env:
      FILEVORA_S3_ENDPOINT: http://127.0.0.1:9000
      FILEVORA_S3_BUCKET: filevora-ci
      FILEVORA_S3_ACCESS_KEY_ID: local
      FILEVORA_S3_SECRET_ACCESS_KEY: localpassword
      FILEVORA_S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Wait for MinIO
        run: |
          node --input-type=module -e "
          const deadline = Date.now() + 60000;
          while (Date.now() < deadline) {
            try {
              const response = await fetch('http://127.0.0.1:9000/minio/health/live');
              if (response.ok) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          process.exit(1);
          "
      - name: Install FFmpeg and Poppler
        run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: pnpm build
      - run: pnpm --filter filevora exec node --experimental-strip-types --test --test-reporter=spec test/external-services.test.ts test/s3-matrix.test.ts test/video-thumbnails.test.ts test/pdf-pages.test.ts test/pdf-tools.test.ts test/audio-tools.test.ts test/direct-upload.test.ts

  test-postgres:
    name: test-postgres
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filevora
          POSTGRES_PASSWORD: filevora
          POSTGRES_DB: filevora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filevora -d filevora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REDIS_URL: redis://127.0.0.1:6379
      FILEVORA_POSTGRES_URL: postgres://filevora:filevora@127.0.0.1:5432/filevora
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter filevora exec node --experimental-strip-types --test --test-reporter=spec --test-timeout=120000 --test-force-exit test/stored-sql.test.ts test/m7.test.ts

  test-mysql:
    name: test-mysql
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: filevora
          MYSQL_DATABASE: filevora
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfilevora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      FILEVORA_MYSQL_URL: mysql://root:filevora@127.0.0.1:3306/filevora
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter filevora exec node --experimental-strip-types --test --test-reporter=spec --test-timeout=120000 --test-force-exit test/stored-sql.test.ts

  test-pack:
    name: test-pack
    runs-on: ubuntu-latest
    services:
      minio:
        image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
        env:
          MINIO_ROOT_USER: local
          MINIO_ROOT_PASSWORD: localpassword
        ports:
          - 9000:9000
        command: server /data
    env:
      FILEVORA_S3_ENDPOINT: http://127.0.0.1:9000
      FILEVORA_S3_BUCKET: filevora-pack
      FILEVORA_S3_ACCESS_KEY_ID: local
      FILEVORA_S3_SECRET_ACCESS_KEY: localpassword
      FILEVORA_S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Wait for object storage
        run: |
          node --input-type=module -e "
          const deadline = Date.now() + 60000;
          while (Date.now() < deadline) {
            try {
              const response = await fetch('http://127.0.0.1:9000/minio/health/live');
              if (response.ok) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          process.exit(1);
          "
      - run: pnpm build
      - name: Install the packed tarball and smoke it
        run: |
          pnpm --filter filevora pack --pack-destination "$RUNNER_TEMP/pack"
          mkdir -p "$RUNNER_TEMP/scratch"
          cd "$RUNNER_TEMP/scratch"
          npm init -y
          npm install "$RUNNER_TEMP/pack"/filevora-*.tgz
          cp "$GITHUB_WORKSPACE/scripts/pack-smoke.mjs" .
          node pack-smoke.mjs
